[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grover-rudolph"
version = "0.1.0"
description = "Grover-Rudolph algorithm for quantum state preparation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "qubrabench" }
]
dependencies = [
  "qubrabench @ git+https://github.com/qubrabench/qubrabench.git@5df5795ca5706ad975efae5b54ac91e62e97f61f",
  "numpy~=1.24",
  "matplotlib~=3.7",
  "scipy~=1.11.1",
  "cirq~=1.2.0",
  "pandas~=2.0",
]

[project.optional-dependencies]
dev = [
  "black[jupyter]",
  "pytest~=7.3",
  "ruff~=0.0",
  "mypy~=1.2",
  "pandas-stubs~=2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
markers = []

[tool.ruff]
line-length = 100000

[tool.mypy]
plugins = ["numpy.typing.mypy_plugin"]